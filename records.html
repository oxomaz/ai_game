<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>기록 보기 · 미니게임</title>
<style>
  :root{
    --blue:#4285F4; --red:#EA4335; --yellow:#FBBC05; --green:#34A853;
    --bg:#f6f8fc; --card:#fff; --text:#202124; --sub:#5f6368; --border:#e0e3e7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
    display:flex;justify-content:center;padding:32px 16px 60px;}
  .wrap{width:100%;max-width:640px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .top a{color:var(--sub);text-decoration:none;font-size:13px;font-weight:700;}
  h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px;}
  p.sub{color:var(--sub);font-size:13px;margin:0 0 22px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{flex:1;padding:11px;border:2px solid var(--border);background:var(--card);border-radius:11px;
    font-weight:800;font-size:14px;color:var(--sub);cursor:pointer;}
  .tab.on{border-color:var(--blue);color:var(--blue);background:#e8f0fe;}
  .card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:15px;font-weight:800;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  td{padding:8px 4px;border-bottom:1px solid #f1f3f4;}
  tr.me{background:#e8f0fe;font-weight:800;}
  td.n{text-align:right;color:var(--sub);}
  .empty{color:var(--sub);font-size:13.5px;padding:6px 0;}
  .who{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--border);
    border-radius:14px;padding:14px 16px;margin-bottom:18px;}
  .who b{font-size:17px;}
  .who button{margin-left:auto;border:0;background:#f1f3f4;border-radius:9px;padding:8px 12px;
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--sub);}
  .pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;margin-left:6px;}
  .win{background:#e6f4ea;color:#137333;} .lose{background:#fce8e6;color:#c5221f;}
  select{width:100%;padding:11px;border:2px solid var(--border);border-radius:11px;font-size:14px;
    background:var(--card);font-family:inherit;}
  .warn{background:#fef7e0;border:2px solid #fbbc05;border-radius:12px;padding:14px;font-size:13px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./">← 게임 목록</a></div>
  <h1>📊 기록 보기</h1>
  <p class="sub">여기 있는 기록은 <b>서버에 저장</b>돼서 다른 기기·다른 사람에게도 보여요.<br>
  게임 안에서 보는 최고기록·배지는 그 기기 안에만 남는 <b>내 개인 기록</b>이에요.</p>

  <div class="who">
    <span style="font-size:24px">🙋</span>
    <div><b id="myname">…</b><div style="font-size:12px;color:var(--sub)" id="myplays"></div></div>
    <button id="rename">플레이어 바꾸기</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="me">내 기록</button>
    <button class="tab" data-t="rank">전체 랭킹</button>
    <button class="tab" data-t="notes">오답노트</button>
  </div>

  <div id="view"><div class="card"><div class="empty">불러오는 중…</div></div></div>
</div>

<script src="./common/profile.js"></script>
<script src="./common/records.js"></script>
<script>
const GAMES = [
  ["math-speed","⚡ 연산 스피드 퀴즈"],["times-table-shooter","🚀 구구단 슈팅"],
  ["word-cards","🔤 영단어 카드 퀴즈"],["quiz-science","🧠 상식·과학 퀴즈"],
  ["word-chain","🔤 끝말잇기"],["hidden-object","🔍 숨은그림찾기"],
  ["set","🃏 SET 카드게임"],["jump-map","🏃 점프맵 200"],
  ["subway-io","🚇 지하철 슬리더"]
];
const view = document.getElementById("view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = t => { const d = new Date(t*1000);
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const offline = `<div class="card"><div class="warn">기록 서버에 연결하지 못했어요.<br>
  인터넷 연결을 확인하거나, 잠시 뒤 새로고침해 보세요.</div></div>`;

async function header(){
  document.getElementById("myname").textContent = Records.name() || "이름 없음";
  const m = await Records.me();
  if (m && m.ok) document.getElementById("myplays").textContent = `총 ${m.plays.toLocaleString()}판 플레이`;
  return m;
}
document.getElementById("rename").onclick = () => {
  if (window.JG) JG.openPicker();            // 게임과 같은 플레이어 목록을 그대로 쓴다
  else Records.changeName().then(() => { header(); render(); });
};
if (window.JG) JG.on("change", () => { header(); render(); });

async function tabMe(){
  const m = await Records.me();
  if (!m || !m.ok) return offline;
  let h = '<div class="card"><h3>🏆 내 최고기록</h3>';
  h += m.best.length ? "<table>" + m.best.map(b =>
      `<tr><td>${esc(b.label)}</td><td class="n">${b.score.toLocaleString()}점</td>
       <td class="n">${b.rank}위 / ${b.total}명</td></tr>`).join("") + "</table>"
    : '<div class="empty">아직 기록이 없어요. 게임을 한 판 해 보세요!</div>';
  h += "</div>";

  const v = m.versus;
  if (v.win + v.lose + v.draw > 0)
    h += `<div class="card"><h3>⚔️ 온라인 대결 전적</h3>
      <div style="font-size:20px;font-weight:800">${v.win}승 ${v.lose}패 ${v.draw}무
      <span class="pill ${v.win >= v.lose ? "win" : "lose"}">승률 ${Math.round(v.win/(v.win+v.lose+v.draw)*100)}%</span></div></div>`;

  h += '<div class="card"><h3>🕘 최근 플레이</h3>';
  h += m.history.length ? "<table>" + m.history.slice(0,20).map(x =>
      `<tr><td>${esc(x.label)}</td><td class="n">${x.s.toLocaleString()}점</td>
       <td class="n">${when(x.t)}</td></tr>`).join("") + "</table>"
    : '<div class="empty">기록이 없어요.</div>';
  return h + "</div>";
}

async function tabRank(){
  const sel = localStorage.getItem("jg_lastgame") || "jump-map";
  let h = `<div class="card"><select id="g">${GAMES.map(([k,l]) =>
    `<option value="${k}"${k===sel?" selected":""}>${l}</option>`).join("")}</select></div>
    <div id="board"><div class="card"><div class="empty">불러오는 중…</div></div></div>`;
  setTimeout(() => {
    const g = document.getElementById("g");
    g.onchange = () => { localStorage.setItem("jg_lastgame", g.value); drawBoard(g.value); };
    drawBoard(g.value);
  }, 0);
  return h;
}
async function drawBoard(game){
  const box = document.getElementById("board");
  const res = await Records.top(game, 30);
  if (!res || !res.ok) return void (box.innerHTML = offline);
  if (!res.top.length) return void (box.innerHTML =
    '<div class="card"><div class="empty">아직 아무도 기록을 남기지 않았어요. 1등이 되어 보세요! 🥇</div>' + rankedNote(game) + '</div>');
  const medal = ["🥇","🥈","🥉"];
  box.innerHTML = `<div class="card">${rankedNote(game)}<h3>전체 ${res.total}명</h3><table>` +
    res.top.map(t => `<tr class="${t.me?"me":""}"><td style="width:40px">${medal[t.rank-1]||t.rank}</td>
      <td>${esc(t.name)}${t.me?' <span style="color:var(--blue)">(나)</span>':""}</td>
      <td class="n">${t.score.toLocaleString()}</td></tr>`).join("") +
    "</table>" + (res.mine && !res.top.some(t=>t.me)
      ? `<div style="margin-top:10px;padding:9px;background:#e8f0fe;border-radius:9px;font-size:13px">
         내 기록 — ${res.mine.rank}위 · ${res.mine.score.toLocaleString()}점</div>` : "") + "</div>";
}

async function tabNotes(){
  const n = await Records.notes();
  if (!n || !n.ok) return offline;
  if (!n.count) return '<div class="card"><div class="empty">아직 틀린 문제가 없어요. 잘하고 있어요! 🎉</div></div>';
  const by = {};
  n.items.forEach(i => (by[i.label] = by[i.label] || []).push(i));
  return Object.keys(by).map(label =>
    `<div class="card"><h3>${esc(label)} — ${by[label].length}문제</h3><table>` +
    by[label].slice(0,50).map(i =>
      `<tr><td>${esc(i.q)}</td><td class="n" style="color:var(--red)">${esc(i.my||"-")}</td>
       <td class="n" style="color:var(--green);font-weight:800">${esc(i.a)}</td></tr>`).join("") +
    "</table></div>").join("");
}

let tab = "me";
async function render(){
  view.innerHTML = '<div class="card"><div class="empty">불러오는 중…</div></div>';
  view.innerHTML = tab === "me" ? await tabMe() : tab === "rank" ? await tabRank() : await tabNotes();
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); tab = b.dataset.t; render();
});

/* 각 게임의 순위표가 어떤 모드 기준인지 알려준다 (profile.js 의 RANKED) */
function rankedNote(gameKey){
  try{
    const rk = window.JG && JG.RANKED && JG.RANKED[gameKey];
    if (rk) return `<div class="empty" style="text-align:left;padding:8px 2px 0">🌐 이 순위표는 <b>「${esc(rk.label)}」</b> 모드 기록만 올라가요.</div>`;
    return '<div class="empty" style="text-align:left;padding:8px 2px 0">🌐 이 게임은 기록이 <b>시간(작을수록 좋음)</b>이라 순위표를 만들지 않았어요.</div>';
  }catch(e){ return ''; }
}

(async () => {
  /* 게임에서 쓰는 플레이어를 그대로 이어받는다 (프로필별로 서버 ID가 다름) */
  if (window.JG && Records.useProfile) Records.useProfile(JG.player().id, JG.player().name);
  if (!Records.name()) await Records.ensureName();
  header(); render();
})();
</script>
</body>
</html>
