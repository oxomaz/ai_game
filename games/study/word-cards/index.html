<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영단어 카드 퀴즈</title>
<style>
  :root{
    --blue:#4285F4; --red:#EA4335; --yellow:#FBBC05; --green:#34A853;
    --bg:#f6f8fc; --card:#fff; --text:#202124; --sub:#5f6368; --border:#e0e3e7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; justify-content:center; padding:14px;
  }
  .wrap{width:100%; max-width:460px;}
  h1{font-size:24px; text-align:center; margin:6px 0 4px; letter-spacing:-1px;}
  .tag{text-align:center; color:var(--sub); font-size:13px; margin:0 0 16px;}
  .panel{background:var(--card); border:2px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .label{font-size:13px; font-weight:800; color:var(--sub); margin-bottom:8px;}
  .opts{display:flex; flex-wrap:wrap; gap:7px;}
  .opt{
    flex:1 1 auto; min-width:70px; text-align:center; padding:11px 8px; border-radius:11px;
    border:2px solid var(--border); background:#fff; font-size:14px; font-weight:700;
    cursor:pointer; user-select:none;
  }
  .opt.on{border-color:var(--blue); background:#e8f0fe; color:var(--blue);}
  .opts.lv .opt{flex:1 1 44%; font-size:15px; padding:13px 6px;}
  .btn{
    display:block; width:100%; padding:15px; border:none; border-radius:13px; background:var(--blue);
    color:#fff; font-size:17px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn.ghost{background:#fff; color:var(--sub); border:2px solid var(--border);}
  .btn.vs{background:linear-gradient(135deg,#7f8bff,#b58cff); margin-top:9px;}
  .hide{display:none !important;}
  a.back{display:block; text-align:center; margin-top:14px; color:var(--sub); font-size:13px;}

  .top{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .top .prog{flex:1; height:9px; background:#e6eaf0; border-radius:99px; overflow:hidden;}
  .top .prog i{display:block; height:100%; background:var(--blue); width:0; transition:width .25s;}
  .top .cnt{font-size:13px; font-weight:800; color:var(--sub); min-width:52px; text-align:right;}

  /* 플래시카드 */
  .flip{perspective:1000px; margin-bottom:14px;}
  .flipInner{
    position:relative; width:100%; height:230px; transition:transform .45s;
    transform-style:preserve-3d; cursor:pointer;
  }
  .flip.on .flipInner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--card); border:2px solid var(--border); border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:16px;
  }
  .face.back{transform:rotateY(180deg); background:#e8f0fe; border-color:var(--blue);}
  .word{font-size:38px; font-weight:800; letter-spacing:-1px; word-break:break-all; text-align:center;}
  .mean{font-size:32px; font-weight:800; color:var(--blue); text-align:center;}
  .cat{font-size:12px; color:var(--sub); font-weight:700;}
  .hint{font-size:12px; color:var(--sub);}
  .spk{
    border:2px solid var(--border); background:#fff; border-radius:99px; padding:7px 15px;
    font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--sub);
  }
  .navRow{display:flex; gap:9px;}
  .navRow .btn{flex:1;}

  /* 퀴즈 */
  .qbox{
    background:var(--card); border:2px solid var(--border); border-radius:18px;
    padding:26px 14px; text-align:center; margin-bottom:12px;
  }
  .qword{font-size:34px; font-weight:800; word-break:break-all;}
  .qsub{font-size:12px; color:var(--sub); margin-top:6px;}
  .choices{display:grid; gap:9px;}
  .choice{
    padding:15px 12px; border-radius:13px; border:2px solid var(--border); background:#fff;
    font-size:17px; font-weight:700; cursor:pointer; text-align:center; font-family:inherit; color:var(--text);
  }
  .choice.ok{border-color:var(--green); background:#e6f4ea; color:var(--green);}
  .choice.no{border-color:var(--red); background:#fce8e6; color:var(--red);}
  .choice:disabled{cursor:default;}

  /* 결과 */
  .big{font-size:46px; font-weight:800; text-align:center; color:var(--blue); line-height:1.1;}
  .rows{margin:14px 0;}
  .row{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--border); font-size:15px;}
  .wrongs{max-height:190px; overflow:auto; font-size:15px; line-height:2;}
  .wrongs b{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">

  <section id="home">
    <div id="jgChip" style="display:flex; justify-content:center; margin-bottom:6px;"></div>
    <h1>🔤 영단어 카드 퀴즈</h1>
    <p class="tag" id="homeTag">나이에 맞는 단계를 골라보세요</p>

    <div class="panel">
      <div class="label">나이 단계</div>
      <div class="opts lv" id="lvBox"></div>
      <div class="hint" style="margin-top:8px;" id="lvHint"></div>
    </div>

    <div class="panel">
      <div class="label">주제 (여러 개 가능)</div>
      <div class="opts" id="catBox"></div>
      <button class="btn ghost" id="allBtn" style="margin-top:9px; padding:10px; font-size:14px;">전체 선택 / 해제</button>
    </div>

    <div class="panel">
      <div class="label">방식</div>
      <div class="opts" id="modeBox">
        <div class="opt on" data-m="card">📇 카드 외우기</div>
        <div class="opt" data-m="e2k">영어 → 뜻</div>
        <div class="opt" data-m="k2e">뜻 → 영어</div>
      </div>
      <div class="hint" style="margin-top:8px;" id="modeHint">카드를 눌러 뒤집으면서 단어를 외워요.</div>
    </div>

    <div class="panel">
      <div class="label">문제 수</div>
      <div class="opts" id="numBox">
        <div class="opt on" data-n="10">10개</div>
        <div class="opt" data-n="20">20개</div>
        <div class="opt" data-n="0">전부</div>
      </div>
    </div>

    <div class="panel">
      <div class="label">최고 기록</div>
      <div id="bestTxt" style="font-size:15px; font-weight:700;">아직 없어요</div>
    </div>

    <button class="btn" id="startBtn">시작하기</button>
    <button class="btn vs" id="vsBtn">🌐 친구랑 온라인 대결</button>
    <a class="back" href="../../../">← 게임 목록</a>
  </section>

  <!-- 카드 모드 -->
  <section id="cardView" class="hide">
    <div class="top">
      <div class="prog"><i id="cProg"></i></div>
      <div class="cnt" id="cCnt">1 / 10</div>
    </div>
    <div class="flip" id="flip">
      <div class="flipInner">
        <div class="face">
          <div class="cat" id="cCat">동물</div>
          <div class="word" id="cWord">apple</div>
          <button class="spk" id="cSpk">🔊 발음 듣기</button>
          <div class="hint">카드를 누르면 뜻이 나와요</div>
        </div>
        <div class="face back">
          <div class="mean" id="cMean">사과</div>
          <div class="hint">다시 누르면 단어로 돌아가요</div>
        </div>
      </div>
    </div>
    <div class="navRow">
      <button class="btn ghost" id="cPrev">← 이전</button>
      <button class="btn" id="cNext">다음 →</button>
    </div>
    <a class="back" href="#" id="cQuit">그만하기</a>
  </section>

  <!-- 퀴즈 모드 -->
  <section id="quizView" class="hide">
    <div class="top">
      <div class="prog"><i id="qProg"></i></div>
      <div class="cnt" id="qCnt">1 / 10</div>
    </div>
    <div class="qbox">
      <div class="qword" id="qWord">apple</div>
      <div class="qsub" id="qSub">알맞은 뜻을 고르세요</div>
      <button class="spk" id="qSpk" style="margin-top:10px;">🔊 발음 듣기</button>
    </div>
    <div class="choices" id="choices"></div>
    <a class="back" href="#" id="qQuit">그만하기</a>
  </section>

  <!-- 결과 -->
  <section id="over" class="hide">
    <h1>결과</h1>
    <div class="panel">
      <div class="big" id="finalScore">0</div>
      <div style="text-align:center; color:var(--sub); font-size:13px; margin-top:4px;">점</div>
      <div class="rows">
        <div class="row"><span>맞힌 단어</span><b id="rHit">0</b></div>
        <div class="row"><span>틀린 단어</span><b id="rMiss">0</b></div>
      </div>
      <div id="jgRes" style="margin:12px 0;"></div>
      <div class="label" id="wrongLabel">틀린 단어 다시 보기</div>
      <div class="wrongs" id="wrongList"></div>
    </div>
    <button class="btn" id="againBtn">한 번 더</button>
    <button class="btn ghost" id="retryWrong" style="margin-top:9px;">틀린 단어만 다시</button>
    <button class="btn ghost" id="homeBtn" style="margin-top:9px;">설정 바꾸기</button>
    <a class="back" href="../../../">← 게임 목록</a>
  </section>

</div>

<script src="../../../common/profile.js"></script>
<script src="../../../common/versus.js"></script>

/* ---------- 단계 도우미 ---------- */
function lvByKey(k){
  for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].key === k) return LEVELS[i];
  return LEVELS[0];
}
function catsOf(k){ return Object.keys(lvByKey(k).words); }
function wordsOf(k, cats){
  var lv = lvByKey(k), out = [];
  cats.forEach(function(c){
    var arr = lv.words[c];
    if(arr) arr.forEach(function(w){ out.push({ en:w[0], ko:w[1], cat:c }); });
  });
  return out;
}
function allOf(k){ return wordsOf(k, catsOf(k)); }

/* ---------- 기록 이름표 (플레이어별 기록은 common/profile.js 의 JG 가 맡는다) ----------
   지금 고른 설정을 사람이 읽을 수 있는 한 줄로 만든다. 설정마다 최고 기록이 따로 쌓인다. */
function lvNm(k){ return lvByKey(k).label.replace(/^\S+\s*/, ""); }   // "🐥 초3~4" → "초3~4"
function catTxt(){
  var sel = selCats();

}
function wayTxt(m){ return m === "k2e" ? "뜻→영어" : m === "card" ? "카드 외우기" : "영→뜻"; }
function numTxt(){ var n = selNum(); return n > 0 ? (n + "문제") : "전부"; }
function recMode(online){
  if(online) return "온라인 대결";
  return lvNm(curLv) + " · " + catTxt() + " · " + wayTxt(selMode()) + " · " + numTxt();
}

/* ---------- 발음 (지원 안 되면 조용히 무시) ---------- */
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 공통 ---------- */
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var S = null;

/* 한 문제의 보기 4개(정답 포함)를 만든다 */
function makeChoices(w, all){
  var same = all.filter(function(x){ return x.cat === w.cat && x.en !== w.en; });
  var pool = same.length >= 3 ? same : all.filter(function(x){ return x.en !== w.en; });
  var others = shuffle(pool).slice(0,3);
  return shuffle(others.concat([w]));
}

/* ---------- 같은 단어가 짧은 간격으로 또 나오지 않게 ----------
   JG.shuffleBag 은 단어를 잘 섞어 한 바퀴씩 돌려준다. 그래서 "한 번 더"를
   눌러도 이미 나온 단어가 바로 또 나오지 않고, 단어장을 골고루 훑게 된다.
   ⚠ 온라인 대결은 양쪽이 똑같은 문제를 받아야 하므로 여기를 쓰지 않고
      Versus.seeded() 안의 shuffle 을 그대로 쓴다. */
var wcBag = null, wcBagKey = "", wcRecent = [];
function drawWords(n){
  var pool = wordsOf(curLv, selCats());
  if(!pool.length) return [];
  if(n <= 0 || n >= pool.length) return shuffle(pool);
  if(!window.JG || !JG.shuffleBag) return shuffle(pool).slice(0, n);
  try{
    var key = curLv + "|" + selCats().join(",");
    if(!wcBag || wcBagKey !== key){ wcBag = JG.shuffleBag(pool); wcBagKey = key; wcRecent = []; }
    /* 한 바퀴가 끝나고 다시 섞일 때 방금 나온 단어가 또 나오지 않도록,
       최근 memo개는 건너뛴다(건너뛴 단어는 다음 바퀴에 나온다). */
    var memo = Math.max(4, Math.min(20, Math.floor(pool.length / 4)));
    var out = [], seen = {}, tries = 0;
    while(out.length < n && tries < pool.length * 4){
      tries++;
      var w = wcBag.next();
      if(!w || seen[w.en]) continue;                        // 한 판 안에서는 절대 겹치지 않게
      if(wcRecent.indexOf(w.en) >= 0 && tries < pool.length * 2) continue;
      seen[w.en] = 1; out.push(w);
      wcRecent.push(w.en);
      if(wcRecent.length > memo) wcRecent.shift();
    }
    return out.length ? out : shuffle(pool).slice(0, n);
  }catch(e){ return shuffle(pool).slice(0, n); }
}

function start(list){
  var mode = selMode();
  var pool = list ? shuffle(list) : drawWords(selNum());
  if(!pool.length){ return; }
  begin(mode, pool, curLv, null);
}

/* 실제 게임 시작 (싱글·온라인 공용) */
function begin(mode, pool, lvKey, pre){
  S = { mode:mode, list:pool, i:0, hit:0, miss:0, wrongs:[], lock:false, lv:lvKey, pre:pre, all:allOf(lvKey) };
  $("home").classList.add("hide"); $("over").classList.add("hide");
  if(mode === "card"){
    $("quizView").classList.add("hide");
    $("cardView").classList.remove("hide");
    showCard();
  }else{
    $("cardView").classList.add("hide");
    $("quizView").classList.remove("hide");
    showQuiz();
  }
}

/* ---------- 카드 모드 ---------- */
function showCard(){
  var w = S.list[S.i];
  $("flip").classList.remove("on");
  $("cWord").textContent = w.en;
  $("cMean").textContent = w.ko;
  $("cCat").textContent = w.cat;
  $("cCnt").textContent = (S.i+1) + " / " + S.list.length;
  $("cProg").style.width = ((S.i+1)/S.list.length*100) + "%";
  $("cNext").textContent = (S.i === S.list.length-1) ? "다 외웠어요 ✓" : "다음 →";
}
$("flip").onclick = function(e){
  if(e.target.closest(".spk")) return;
  $("flip").classList.toggle("on");
};
$("cSpk").onclick = function(e){ e.stopPropagation(); speak(S.list[S.i].en); };
$("cPrev").onclick = function(){ if(S.i > 0){ S.i--; showCard(); } };
$("cNext").onclick = function(){
  if(S.i < S.list.length-1){ S.i++; showCard(); }
  else{
    $("cardView").classList.add("hide");
    $("home").classList.remove("hide");
  }
};
$("cQuit").onclick = function(e){
  e.preventDefault();
  $("cardView").classList.add("hide");
  $("home").classList.remove("hide");
};

/* ---------- 퀴즈 모드 ---------- */
function showQuiz(){
  S.lock = false;
  var w = S.list[S.i];
  var e2k = (S.mode === "e2k");
  $("qWord").textContent = e2k ? w.en : w.ko;
  $("qSub").textContent = e2k ? "알맞은 뜻을 고르세요" : "알맞은 영어 단어를 고르세요";
  $("qSpk").classList.toggle("hide", !e2k);
  $("qCnt").textContent = (S.i+1) + " / " + S.list.length;
  $("qProg").style.width = ((S.i+1)/S.list.length*100) + "%";

  // 온라인 대결이면 미리 만들어 둔 보기(양쪽 동일)를, 아니면 지금 만든다
  var choices = S.pre ? S.pre[S.i] : makeChoices(w, S.all);

  var box = $("choices");
  box.innerHTML = "";
  choices.forEach(function(c){
    var b = document.createElement("button");
    b.className = "choice";
    b.textContent = e2k ? c.ko : c.en;
    b.onclick = function(){ answer(b, c, w); };
    box.appendChild(b);
  });
}
function answer(btn, picked, correct){
  if(S.lock) return;
  S.lock = true;
  var e2k = (S.mode === "e2k");
  var buttons = $("choices").querySelectorAll(".choice");
  buttons.forEach(function(b){
    b.disabled = true;
    if(b.textContent === (e2k ? correct.ko : correct.en)) b.classList.add("ok");
  });
  if(picked.en === correct.en){
    S.hit++;
  }else{
    S.miss++;
    btn.classList.add("no");
    S.wrongs.push(correct);
  }
  if(window.Versus && Versus.active()) Versus.setScore(S.hit);
  setTimeout(function(){
    if(S.i < S.list.length-1){ S.i++; showQuiz(); }
    else finish();
  }, picked.en === correct.en ? 450 : 950);
}
$("qSpk").onclick = function(){ speak(S.list[S.i].en); };
$("qQuit").onclick = function(e){ e.preventDefault(); finish(); };

function finish(){
  var total = S.hit + S.miss;
  $("finalScore").textContent = total ? Math.round(S.hit/total*100) : 0;
  $("rHit").textContent = S.hit + "개";
  $("rMiss").textContent = S.miss + "개";
  if(S.wrongs.length){
    $("wrongLabel").classList.remove("hide");
    $("retryWrong").classList.remove("hide");
    $("wrongList").innerHTML = S.wrongs.map(function(w){
      return "<div><b>" + w.en + "</b> — " + w.ko + "</div>";
    }).join("");
  }else{
    $("wrongLabel").classList.add("hide");
    $("retryWrong").classList.add("hide");
    $("wrongList").innerHTML = "<div style='color:var(--green); font-weight:800;'>전부 다 맞혔어요! 👏</div>";
  }
  $("quizView").classList.add("hide");
  $("over").classList.remove("hide");
  if(window.Versus && Versus.active()) Versus.finish(S.hit);

  var info = saveRecord();
  if(info){
    JG.resultBox("jgRes", {
      gameId: GAME_ID, score: info.score, res: info.res, unit: "개", badges: info.badges,
      extra: [["모드", info.label], ["정확도", (total ? Math.round(S.hit/total*100) : 0) + "%"]]
    });
  }else{
    $("jgRes").innerHTML = "";
  }
  showBest();
}

/* 한 판이 끝나면 기록과 배지를 저장한다.
   JG 가 없거나 저장이 막혀 있어도 게임은 그대로 굴러간다. */
function saveRecord(){
  if(!window.JG) return null;
  try{
    var online = !!(window.Versus && Versus.active());
    var total = S.hit + S.miss;
    var label = online ? "온라인 대결" : recMode(false);
    var res = JG.submit(GAME_ID, { score: S.hit, mode: label, unit: "개" });

    /* 누적 기록: 지금까지 맞힌 단어 수 · 풀어본 주제 */
    var totalHit = JG.stat(GAME_ID, "correct", S.hit);
    var topics = 0;
    (S.list || []).forEach(function(w){ topics = JG.statAdd(GAME_ID, "topics", w.cat); });

    var badges = JG.awardAll({
      "wc-quiz18":   (total >= 20 && S.hit >= 18),
      "wc-perfect":  (total > 0 && S.miss === 0),
      "wc-total100": totalHit >= 100,
      "wc-topics":   topics >= 5
    });
    return { res: res, score: S.hit, badges: badges, label: label };
  }catch(e){ return null; }
}

$("startBtn").onclick = function(){ start(null); };
$("againBtn").onclick = function(){ start(null); };
$("retryWrong").onclick = function(){ start(shuffle(S.wrongs)); };

function goHomeScreen(){

  $("quizView").classList.add("hide");
  $("over").classList.add("hide");
  $("home").classList.remove("hide");

function openVersus(){
  Versus.open({
    game: "word-cards",
    /* 방장 설정을 그대로 참가자에게 전달한다 */
    getSettings: function(){
      var m = selMode();
      return { lv: curLv, cats: selCats(), n: selNum() || 10, mode: (m === "card" ? "e2k" : m) };
    },
    settingsHTML: function(){
      /* 참가자 화면에서는 아직 방장 설정을 모르므로 단계 이름을 말하지 않는다 */
      var m = selMode();
      var who = Versus.isHost
        ? '내가 고른 <b>' + lvByKey(curLv).label + ' 단계 · 주제 · 문제 수</b>로 둘 다 플레이해요.' +
          (m === "card" ? '<br>대결은 <b>영어 → 뜻</b> 퀴즈로 진행돼요!' : '')
        : '방장이 고른 <b>나이 단계 · 주제 · 문제 수</b>로 둘 다 플레이해요.';
      return '<div class="vs-note">' + who +
             '<br>똑같은 단어가 똑같은 순서로 나오고, <b>많이 맞힌 사람이 승리</b>!</div>';
    },
    onStart: function(ctx){
      var st = ctx.settings || { lv:"lv3", cats:catsOf("lv3"), n:10, mode:"e2k" };
      var all = wordsOf(st.lv, st.cats);
      if(!all.length) all = allOf(st.lv);
      var everything = allOf(st.lv);

      /* ⚠ seeded 안에서는 "양쪽에 공통인 값"만 써야 난수가 어긋나지 않는다.
         (이름·화면 크기·오답노트 같은 개인 정보는 절대 쓰지 않는다) */
      var made = Versus.seeded(function(){
        var pool = shuffle(all);
        if(st.n > 0) pool = pool.slice(0, st.n);
        var pre = pool.map(function(w){ return makeChoices(w, everything); });
        return { pool: pool, pre: pre };
      });

      begin(st.mode, made.pool, st.lv, made.pre);
      Versus.setScore(0);
    },
    onData: function(){ /* 추가 메시지 없음 */ },
    onLeave: function(){ goHomeScreen(); showBest(); },
    onCancel: function(){ goHomeScreen(); showBest(); }
  });
}

/* 온라인 로비의 이름칸을 내 프로필 이름으로 미리 채워준다 */
function seedVersusName(){
  if(!window.JG) return;
  try{
    var fill = function(){
      var i = document.getElementById("vsName");
      if(i && !i.value) i.value = JG.player().name.slice(0, 8);
    };
    fill(); setTimeout(fill, 40);
  }catch(e){}
}
$("vsBtn").onclick = function(){ openVersus(); seedVersusName(); };

/* ---------- 플레이어 프로필 ---------- */
if(window.JG){
  try{
    JG.mountChip("jgChip");
    JG.on("change", function(){ wcBag = null; wcRecent = []; showBest(); });
  }catch(e){}
}
showBest();

/* 검증 스크립트에서 출제기를 그대로 불러 쓰기 위한 통로 */
window.__wcTest = { drawWords:drawWords, recMode:recMode, S:function(){ return S; } };
</script>
