<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>구구단 슈팅</title>
<style>
  :root{
    --blue:#4285F4; --red:#EA4335; --yellow:#FBBC05; --green:#34A853;
    --bg:#f6f8fc; --card:#fff; --text:#202124; --sub:#5f6368; --border:#e0e3e7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; justify-content:center; padding:14px;
  }
  .wrap{width:100%; max-width:460px;}
  h1{font-size:24px; text-align:center; margin:6px 0 4px; letter-spacing:-1px;}
  .tag{text-align:center; color:var(--sub); font-size:13px; margin:0 0 16px;}
  .panel{background:var(--card); border:2px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .label{font-size:13px; font-weight:800; color:var(--sub); margin-bottom:8px;}
  .opts{display:flex; flex-wrap:wrap; gap:7px;}
  .opt{
    flex:1 1 auto; min-width:52px; text-align:center; padding:11px 6px; border-radius:11px;
    border:2px solid var(--border); background:#fff; font-size:15px; font-weight:700;
    cursor:pointer; user-select:none;
  }
  .opt.on{border-color:var(--blue); background:#e8f0fe; color:var(--blue);}
  .opts.age .opt{flex:1 1 0; min-width:0; padding:12px 2px; font-size:13px; line-height:1.35;}
  .opts.age .opt .emo{display:block; font-size:26px; margin-bottom:3px;}
  .hint{margin-top:9px; font-size:12.5px; font-weight:700; color:var(--sub); background:#f2f5fa;
        border-radius:11px; padding:9px 11px; line-height:1.55;}
  .btn{
    display:block; width:100%; padding:15px; border:none; border-radius:13px; background:var(--blue);
    color:#fff; font-size:17px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn.ghost{background:#fff; color:var(--sub); border:2px solid var(--border);}
  .btn.vs{background:linear-gradient(150deg,#7f8bff,#b58cff); margin-top:9px;}
  .hide{display:none !important;}
  a.back{display:block; text-align:center; margin-top:14px; color:var(--sub); font-size:13px;}

  /* play */
  .hud{display:flex; gap:7px; margin-bottom:10px;}
  .hud > div{flex:1; background:var(--card); border:2px solid var(--border); border-radius:12px; padding:8px 3px; text-align:center;}
  .hud .k{font-size:11px; color:var(--sub); font-weight:700;}
  .hud .v{font-size:18px; font-weight:800; margin-top:2px;}
  #stage{
    position:relative; width:100%; height:62vh; min-height:340px; overflow:hidden;
    background:linear-gradient(#0b1b3a,#16305e 60%,#25406e);
    border-radius:16px; border:2px solid #0b1b3a; touch-action:manipulation;
  }
  .star{position:absolute; width:2px; height:2px; background:#fff; opacity:.6; border-radius:50%;}
  .qstrip{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
    background:#0b1b3a; border:2px solid #0b1b3a; border-radius:14px; padding:12px 14px;
  }
  #qbar{flex:1; text-align:center; color:#fff; font-size:27px; font-weight:800; letter-spacing:1px;}
  .lifebar{font-size:16px; letter-spacing:1px;}
  .bub{
    position:absolute; width:58px; height:58px; margin-left:-29px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; font-weight:800; color:#fff; cursor:pointer;
    background:radial-gradient(circle at 32% 30%, #7aa8ff, #3163c4);
    box-shadow:0 0 12px rgba(122,168,255,.5); border:2px solid #cfe0ff;
  }
  /* 보기가 적을수록 크게 — 어린 아이가 누르기 쉽게 */
  #stage.c2 .bub{width:82px; height:82px; margin-left:-41px; font-size:30px;}
  #stage.c3 .bub{width:68px; height:68px; margin-left:-34px; font-size:24px;}
  .bub.pop{animation:pop .22s ease-out forwards;}
  @keyframes pop{to{transform:scale(1.7); opacity:0;}}
  .bub.bad{background:radial-gradient(circle at 32% 30%, #ff9d95, #c62f22); border-color:#ffd7d3;}
  #ship{
    position:absolute; bottom:6px; left:50%; margin-left:-22px; width:44px; height:30px; z-index:4;
    pointer-events:none; transition:left .12s;
  }
  #laser{
    position:absolute; width:4px; background:#FBBC05; z-index:3; opacity:0;
    box-shadow:0 0 10px #FBBC05; pointer-events:none; margin-left:-2px;
  }
  #laser.fire{opacity:1;}
  .toast{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 10px #000;
    z-index:7; opacity:0; pointer-events:none; transition:opacity .15s; text-align:center;
  }
  .toast.show{opacity:1;}

  /* result */
  .big{font-size:46px; font-weight:800; text-align:center; color:var(--blue); line-height:1.1;}
  .rows{margin:14px 0;}
  .row{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--border); font-size:15px;}
  .new{text-align:center; color:var(--red); font-weight:800; margin-bottom:8px;}
  .wrongs{max-height:150px; overflow:auto; font-size:14px; color:var(--sub); line-height:1.9;}
</style>
</head>
<body>
<div class="wrap">

  <section id="home">
    <h1>🚀 구구단 슈팅</h1>
    <p class="tag">내려오는 숫자 중에서 정답을 쏘세요!</p>

    <div class="panel">
      <div class="label">몇 살이에요? (난이도)</div>
      <div class="opts age" id="ageBox"></div>
      <div class="hint" id="ageHint"></div>
    </div>

    <div class="panel">
      <div class="label">연습할 단 (여러 개 가능)</div>
      <div class="opts" id="danBox"></div>
      <button class="btn ghost" id="allBtn" style="margin-top:9px; padding:10px; font-size:14px;">전체 선택 / 해제</button>
    </div>

    <div class="panel">
      <div class="label">속도</div>
      <div class="opts" id="spBox">
        <div class="opt on" data-s="0">느리게</div>
        <div class="opt" data-s="1">보통</div>
        <div class="opt" data-s="2">빠르게</div>
      </div>
    </div>

    <div class="panel">
      <div class="label">최고 기록</div>
      <div id="bestTxt" style="font-size:15px; font-weight:700;">아직 없어요</div>
    </div>

    <button class="btn" id="startBtn">시작하기</button>
    <button class="btn vs" id="vsBtn">🌐 친구랑 온라인 대결</button>
    <a class="back" href="../../../">← 게임 목록</a>
  </section>

  <section id="play" class="hide">
    <div class="hud">
      <div><div class="k">점수</div><div class="v" id="scoreV">0</div></div>
      <div><div class="k">맞힌 개수</div><div class="v" id="hitV">0</div></div>
      <div><div class="k" id="lvK">단계</div><div class="v" id="lvV">1</div></div>
    </div>
    <div class="qstrip">
      <div id="qbar">2 × 3 = ?</div>
      <div class="lifebar" id="lifeV">❤️❤️❤️</div>
    </div>
    <div id="stage">
      <div id="laser"></div>
      <svg id="ship" viewBox="0 0 44 30">
        <polygon points="22,0 34,26 22,20 10,26" fill="#FBBC05" stroke="#fff" stroke-width="1.5"/>
      </svg>
      <div class="toast" id="toast"></div>
    </div>
    <a class="back" href="#" id="quitBtn">그만하기</a>
  </section>

  <section id="over" class="hide">
    <h1>결과</h1>
    <div class="panel">
      <div id="newBest" class="new hide">🎉 최고 기록 경신!</div>
      <div class="big" id="finalScore">0</div>
      <div style="text-align:center; color:var(--sub); font-size:13px; margin-top:4px;">점</div>
      <div class="rows">
        <div class="row"><span>맞힌 개수</span><b id="rHit">0</b></div>
        <div class="row"><span>도달 단계</span><b id="rLv">1</b></div>
      </div>
      <div class="label" id="wrongLabel">헷갈렸던 문제</div>
      <div class="wrongs" id="wrongList"></div>
    </div>
    <button class="btn" id="againBtn">한 번 더</button>
    <button class="btn ghost" id="homeBtn" style="margin-top:9px;">설정 바꾸기</button>
    <a class="back" href="../../../">← 게임 목록</a>
  </section>

</div>

<script src="../../../common/versus.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };

/* ---------- 저장소 (막혀 있으면 메모리로 대체) ---------- */
var mem = {};
function loadBest(){
  try{ var r = localStorage.getItem("ttShooterBest"); if(r) return JSON.parse(r); }catch(e){}
  return mem.best || {};
}
function saveBest(o){ mem.best = o; try{ localStorage.setItem("ttShooterBest", JSON.stringify(o)); }catch(e){} }

/* ---------- 나이 단계 (4단계: 6살 ~ 초6) ----------
   allow   : 고를 수 있는 단
   pick    : 처음에 켜져 있는 단
   choices : 한 번에 내려오는 보기 개수
   base    : 기본 낙하 속도(px/초)
   grow    : 단계가 오를 때 빨라지는 정도
   life    : 목숨 개수
   kinds   : 나오는 문제 종류 (mul=구구단, div=나눗셈 몫, big=두 자리 × 한 자리) */
var AGE = [
  { emo:"🐣", nm:"6~7살", allow:[2,5],                 pick:[2,5],       choices:2, base:30,  grow:0.06, life:5, defSp:0,
    kinds:["mul"], hint:"2단과 5단만 나와요. 아주 천천히 내려오니까 천천히 골라도 돼요!" },
  { emo:"🐤", nm:"초1~2", allow:[2,3,4,5],             pick:[2,3,4,5],   choices:3, base:52,  grow:0.10, life:4, defSp:0,
    kinds:["mul"], hint:"2단부터 5단까지 연습해요. 보기는 3개!" },
  { emo:"🐥", nm:"초3~4", allow:[2,3,4,5,6,7,8,9],     pick:[2,3,4,5,6,7,8,9], choices:4, base:82, grow:0.16, life:3, defSp:1,
    kinds:["mul"], hint:"구구단 전체(2~9단)! 보기는 4개예요." },
  { emo:"🦅", nm:"초5~6", allow:[2,3,4,5,6,7,8,9],     pick:[2,3,4,5,6,7,8,9], choices:4, base:118, grow:0.20, life:3, defSp:1,
    kinds:["mul","div","big"], hint:"구구단 + 나눗셈(몫 맞히기) + 두 자리 × 한 자리. 빠르게 내려와요!" }
];
var SP_MUL  = [0.75, 1, 1.35];
var SP_NAME = ["느리게","보통","빠르게"];
var cfg = { lv:0, dans:[2,5], sp:0 };

/* ---------- 시작 화면 UI ---------- */
function renderAge(){
  $("ageBox").innerHTML = AGE.map(function(a,i){
    return '<div class="opt'+(i===cfg.lv?" on":"")+'" data-lv="'+i+'">'+
           '<span class="emo">'+a.emo+'</span>'+a.nm+'</div>';
  }).join("");
  $("ageHint").textContent = AGE[cfg.lv].hint;
}
function renderDans(){
  var A = AGE[cfg.lv];
  $("danBox").innerHTML = A.allow.map(function(d){
    return '<div class="opt'+(A.pick.indexOf(d) >= 0 ? " on" : "")+'" data-d="'+d+'">'+d+'단</div>';
  }).join("");
  cfg.dans = A.pick.slice();
}
function renderSp(){
  var A = AGE[cfg.lv];
  $("spBox").querySelectorAll(".opt").forEach(function(o){ o.classList.toggle("on", +o.dataset.s === A.defSp); });
  cfg.sp = A.defSp;
}
function readCfg(){
  cfg.dans = [].map.call($("danBox").querySelectorAll(".opt.on"), function(o){ return +o.dataset.d; });
  var s = $("spBox").querySelector(".opt.on");
  cfg.sp = s ? +s.dataset.s : AGE[cfg.lv].defSp;
  showBest();
}
$("ageBox").addEventListener("click", function(e){
  var el = e.target.closest(".opt"); if(!el) return;
  cfg.lv = +el.dataset.lv;
  renderAge(); renderDans(); renderSp(); readCfg();
});
$("danBox").addEventListener("click", function(e){
  var el = e.target.closest(".opt"); if(!el) return;
  el.classList.toggle("on");
  if(!$("danBox").querySelector(".opt.on")) el.classList.add("on");   // 최소 1개 유지
  readCfg();
});
$("allBtn").onclick = function(){
  var box = $("danBox"), n = box.querySelectorAll(".opt").length;
  var allOn = box.querySelectorAll(".opt.on").length === n;
  box.querySelectorAll(".opt").forEach(function(o){ o.classList.toggle("on", !allOn); });
  if(!box.querySelector(".opt.on")) box.querySelector(".opt").classList.add("on");
  readCfg();
};
$("spBox").addEventListener("click", function(e){
  var el = e.target.closest(".opt"); if(!el) return;
  $("spBox").querySelectorAll(".opt").forEach(function(o){ o.classList.remove("on"); });
  el.classList.add("on"); readCfg();
});
function bestKey(){ return cfg.lv + "|" + cfg.dans.slice().sort(function(a,b){return a-b;}).join(",") + "|" + cfg.sp; }
function showBest(){
  var b = loadBest()[bestKey()];
  $("bestTxt").textContent = b
    ? (b + "점  (" + AGE[cfg.lv].emo + " " + AGE[cfg.lv].nm + " · " + cfg.dans.join("·") + "단 · " + SP_NAME[cfg.sp] + ")")
    : "아직 없어요";
}

/* ---------- 별 배경 (시드와 무관 — 화면 장식일 뿐) ---------- */
var stage = $("stage");
(function stars(){
  for(var i=0;i<40;i++){
    var s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random()*100 + "%";
    s.style.top  = Math.random()*100 + "%";
    s.style.opacity = (0.25 + Math.random()*0.6);
    stage.appendChild(s);
  }
})();

/* ---------- 문제 만들기 ----------
   화면 크기·플레이어 이름 같은 "사람마다 다른 값"은 절대 쓰지 않는다.
   (온라인 대결에서 양쪽 난수가 어긋나지 않게 하기 위함)         */
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function makeQ(){
  var A = AGE[cfg.lv];
  var kind = A.kinds[ri(0, A.kinds.length-1)];
  var a, b, ans, txt;
  if(kind === "div"){                                   // 나눗셈 — 몫 맞히기
    a = cfg.dans[ri(0, cfg.dans.length-1)];
    b = ri(2,9);
    ans = b; txt = (a*b) + " ÷ " + a + " = ?";
  }else if(kind === "big"){                             // 두 자리 × 한 자리
    a = ri(11,29);
    b = cfg.dans[ri(0, cfg.dans.length-1)];
    ans = a*b; txt = a + " × " + b + " = ?";
  }else{                                                // 구구단
    a = cfg.dans[ri(0, cfg.dans.length-1)];
    b = ri(1,9);
    ans = a*b; txt = a + " × " + b + " = ?";
  }
  var vals = makeVals(ans, a, b, A.choices, kind);
  var tops = [];
  for(var i=0;i<A.choices;i++) tops.push(-62 - i*ri(8,34));   // 살짝 어긋나게 내려오도록
  return { kind:kind, a:a, b:b, ans:ans, txt:txt, vals:vals, tops:tops };
}

/* 보기 만들기 — 정답 1개 + 헷갈리는 오답들 (모두 서로 다른 양수) */
function makeVals(ans, a, b, n, kind){
  var pool = {}; pool[ans] = true;
  var wrongs = [], tries = 0;
  while(wrongs.length < n-1 && tries < 90){
    tries++;
    var w, r = Math.random();
    if(kind === "div")   w = ans + (Math.random() < .5 ? 1 : -1) * ri(1,3);
    else if(r < .45)     w = a * (b + (Math.random() < .5 ? 1 : -1));
    else if(r < .8)      w = (a + (Math.random() < .5 ? 1 : -1)) * b;
    else                 w = ans + ri(-9,9);
    if(w > 0 && !pool[w]){ pool[w] = true; wrongs.push(w); }
  }
  var f = 1;
  while(wrongs.length < n-1){ f++; if(!pool[f]){ pool[f] = true; wrongs.push(f); } }
  var vals = wrongs.concat([ans]);
  for(var i = vals.length - 1; i > 0; i--){ var j = ri(0,i); var t = vals[i]; vals[i] = vals[j]; vals[j] = t; }
  return vals;
}

var SLOTS = { 2:[0.30,0.70], 3:[0.20,0.50,0.80], 4:[0.16,0.38,0.62,0.84] };

/* ---------- 게임 ---------- */
var G = null, raf = null, lastT = 0;

function start(){
  readCfg();
  beginGame("single");
}

function beginGame(mode){
  var A = AGE[cfg.lv];
  G = { mode:mode, score:0, hit:0, lv:1, life:A.life, maxLife:A.life,
        bubbles:[], q:null, over:false, wrongs:{}, idx:0, total:0 };
  if(mode === "online") G.total = VS.list.length;
  $("home").classList.add("hide"); $("over").classList.add("hide"); $("play").classList.remove("hide");
  stage.querySelectorAll(".bub").forEach(function(b){ b.remove(); });
  stage.className = "c" + A.choices;
  $("lvK").textContent = (mode === "online") ? "남은 문제" : "단계";
  hud();
  setTimeout(nextQ, 60);   // 레이아웃이 잡힌 뒤 스폰
  lastT = 0;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function hud(){
  $("scoreV").textContent = G.score;
  $("hitV").textContent = G.hit;
  // 온라인은 "남은 문제"(지금 푸는 문제 포함), 싱글은 "단계"
  $("lvV").textContent = (G.mode === "online")
    ? Math.max(0, G.total - G.idx + (G.q && !G.over ? 1 : 0))
    : G.lv;
  $("lifeV").textContent = "❤️".repeat(G.life) + "🖤".repeat(Math.max(0, G.maxLife - G.life));
}

function nextQ(){
  if(!G || G.over) return;
  if(G.mode === "online"){
    if(G.idx >= VS.list.length){ finish(); return; }
    G.q = VS.list[G.idx++];
  }else{
    G.q = makeQ();
  }
  $("qbar").textContent = G.q.txt;
  hud();
  spawn();
}

function spawn(){
  var W = stage.clientWidth;
  var slots = SLOTS[G.q.vals.length] || SLOTS[4];
  G.q.vals.forEach(function(v, i){
    var el = document.createElement("div");
    el.className = "bub";
    el.textContent = v;
    var x = W * slots[i];
    el.style.left = x + "px";
    el.style.top = G.q.tops[i] + "px";
    stage.appendChild(el);
    G.bubbles.push({ el:el, v:v, x:x, y:G.q.tops[i], ok:(v === G.q.ans) });
  });
}

function clearBubbles(){
  G.bubbles.forEach(function(b){ if(b.el.parentNode) b.el.remove(); });
  G.bubbles = [];
}

function loop(t){
  if(!G || G.over) return;
  if(!lastT) lastT = t;
  var dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  var A = AGE[cfg.lv];
  var speed = A.base * SP_MUL[cfg.sp] * (1 + (G.lv - 1) * A.grow);
  var H = stage.clientHeight;
  var missed = false;

  for(var i = G.bubbles.length - 1; i >= 0; i--){
    var b = G.bubbles[i];
    b.y += speed * dt;
    b.el.style.top = b.y + "px";
    if(b.y > H){
      if(b.ok) missed = true;
      b.el.remove();
      G.bubbles.splice(i,1);
    }
  }
  if(missed) loseLife("놓쳤어요!");
  raf = requestAnimationFrame(loop);
}

function fireAt(x, y, cb){
  var ship = $("ship"), laser = $("laser");
  var W = stage.clientWidth;
  ship.style.left = Math.max(22, Math.min(W - 22, x)) + "px";
  laser.style.left = x + "px";
  laser.style.top = (y + 20) + "px";
  laser.style.height = Math.max(0, stage.clientHeight - y - 26) + "px";
  laser.classList.add("fire");
  setTimeout(function(){ laser.classList.remove("fire"); if(cb) cb(); }, 110);
}

function toast(txt, color){
  var el = $("toast");
  el.textContent = txt;
  el.style.color = color || "#fff";
  el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 500);
}

stage.addEventListener("click", function(e){
  if(!G || G.over) return;
  var el = e.target.closest(".bub");
  if(!el) return;
  var b = null;
  for(var i=0;i<G.bubbles.length;i++){ if(G.bubbles[i].el === el){ b = G.bubbles[i]; break; } }
  if(!b) return;

  fireAt(b.x, b.y);
  if(b.ok){
    el.classList.add("pop");
    G.hit++;
    G.score += 10 + (G.lv - 1) * 2 + cfg.lv * 3;         // 나이 단계 보너스
    if(G.mode === "single" && G.hit % 5 === 0){ G.lv++; toast("단계 " + G.lv + "!", "#FBBC05"); }
    hud();
    clearBubbles();
    vsPush();
    setTimeout(nextQ, 260);
  }else{
    el.classList.add("bad");
    var k = G.q.txt.replace(" = ?","") + " = " + G.q.ans;
    G.wrongs[k] = (G.wrongs[k] || 0) + 1;
    loseLife("땡! 정답은 " + G.q.ans);
  }
});

function loseLife(msg){
  G.life--;
  hud();
  toast(msg, "#EA4335");
  clearBubbles();
  if(G.life <= 0){ finish(); return; }
  setTimeout(nextQ, 700);
}

function finish(){
  if(!G || G.over) return;
  G.over = true;
  cancelAnimationFrame(raf);
  clearBubbles();

  $("finalScore").textContent = G.score;
  $("rHit").textContent = G.hit + "개";
  $("rLv").textContent = (G.mode === "online") ? (G.idx + "문제 진행") : (G.lv + "단계");

  var ks = Object.keys(G.wrongs).sort(function(a,b){ return G.wrongs[b]-G.wrongs[a]; });
  if(ks.length){
    $("wrongLabel").classList.remove("hide");
    $("wrongList").innerHTML = ks.map(function(k){
      return "<div>" + k + (G.wrongs[k] > 1 ? "  <b style='color:#EA4335'>×" + G.wrongs[k] + "</b>" : "") + "</div>";
    }).join("");
  }else{
    $("wrongLabel").classList.add("hide");
    $("wrongList").innerHTML = "<div style='color:var(--green); font-weight:800;'>하나도 안 틀렸어요! 👏</div>";
  }

  if(G.mode === "single"){
    var all = loadBest(), k2 = bestKey();
    if(!all[k2] || G.score > all[k2]){ all[k2] = G.score; saveBest(all); $("newBest").classList.remove("hide"); }
    else $("newBest").classList.add("hide");
  }else{
    $("newBest").classList.add("hide");
    if(window.Versus && Versus.active()) Versus.finish(G.score);
  }

  $("play").classList.add("hide");
  $("over").classList.remove("hide");
}

$("startBtn").onclick = start;
$("againBtn").onclick = function(){
  if(G && G.mode === "online") return;              // 온라인은 대결 결과창의 "한 판 더!" 로
  start();
};
$("homeBtn").onclick = function(){
  if(G && G.mode === "online" && window.Versus && Versus.active()){ Versus.leave(); return; }
  $("over").classList.add("hide"); $("home").classList.remove("hide"); showBest();
};
$("quitBtn").onclick = function(e){
  e.preventDefault();
  if(G && G.mode === "online" && window.Versus && Versus.active()){ Versus.leave(); return; }
  finish();
};

/* ══════════════ 온라인 대결 ══════════════ */
var VS = { count:10, list:[], sent:-1 };

function vsPush(){
  if(!G || G.mode !== "online") return;
  if(!window.Versus || !Versus.active()) return;
  if(G.score === VS.sent) return;
  VS.sent = G.score;
  Versus.setScore(G.score);
}

/* 로비에서 방장이 문제 수를 고른다 */
function vsPickCount(n, el){
  VS.count = n;
  [].forEach.call(el.parentNode.children, function(c){ c.style.background = "#efeaf6"; c.style.color = "#4a4258"; });
  el.style.background = "#7f8bff"; el.style.color = "#fff";
}

function openVersus(){
  readCfg();
  Versus.open({
    game: "times-table-shooter",
    /* 방장이 고른 나이 단계 · 단 · 속도 · 문제 수를 참가자에게 그대로 적용한다 */
    getSettings: function(){ return { lv: cfg.lv, dans: cfg.dans.slice(), sp: cfg.sp, n: VS.count }; },
    settingsHTML: function(){
      var A = AGE[cfg.lv];
      if(!Versus.isHost){
        return '<div class="vs-note">방장이 고른 <b>나이 단계 · 단 · 문제 수</b>로 둘 다 똑같은 문제를 풀어요. ' +
               '더 많이 맞힌 사람이 이겨요!</div>';
      }
      var btn = function(n){
        var on = (VS.count === n);
        return '<button class="vs-btn" style="background:' + (on ? "#7f8bff" : "#efeaf6") + ';color:' +
               (on ? "#fff" : "#4a4258") + '" onclick="vsPickCount(' + n + ',this)">' + n + '문제</button>';
      };
      return '<div class="vs-note">난이도: <b>' + A.emo + " " + A.nm + '</b> · 단: <b>' + cfg.dans.join("·") +
             '단</b> · 속도: <b>' + SP_NAME[cfg.sp] + '</b><br>' +
             '바꾸려면 나가서 시작 화면에서 고른 뒤 다시 방을 만들어 주세요.</div>' +
             '<div style="font-size:13px;font-weight:800;color:#8a83a0;margin:14px 0 6px">문제 수</div>' +
             '<div class="vs-btns" style="margin-top:0">' + btn(5) + btn(10) + btn(20) + '</div>';
    },
    onStart: function(ctx){
      var s = ctx.settings || {};
      if(typeof s.lv === "number"){
        cfg.lv = s.lv;
        renderAge(); renderDans(); renderSp();
        if(s.dans && s.dans.length){
          cfg.dans = s.dans.slice();
          $("danBox").querySelectorAll(".opt").forEach(function(o){
            o.classList.toggle("on", cfg.dans.indexOf(+o.dataset.d) >= 0);
          });
        }
        if(typeof s.sp === "number"){
          cfg.sp = s.sp;
          $("spBox").querySelectorAll(".opt").forEach(function(o){ o.classList.toggle("on", +o.dataset.s === cfg.sp); });
        }
      }
      VS.count = s.n || 10;
      VS.sent = -1;
      /* 문제·보기·낙하 위치를 전부 seeded 안에서 미리 만든다 → 양쪽이 100% 똑같은 문제 세트.
         화면 폭 같은 사람마다 다른 값은 여기서 쓰지 않는다. */
      Versus.reseed(0);
      VS.list = Versus.seeded(function(){
        var arr = [];
        for(var i = 0; i < VS.count; i++) arr.push(makeQ());
        return arr;
      });
      beginGame("online");
      Versus.setScore(0);
    },
    onLeave: function(){
      if(G) G.over = true;
      cancelAnimationFrame(raf);
      $("play").classList.add("hide"); $("over").classList.add("hide");
      $("home").classList.remove("hide"); showBest();
    },
    onCancel: function(){
      $("play").classList.add("hide"); $("over").classList.add("hide");
      $("home").classList.remove("hide");
    }
  });
}
$("vsBtn").onclick = openVersus;

/* ---------- 시작 ---------- */
renderAge(); renderDans(); renderSp(); showBest();

/* 검증 스크립트에서 문제 생성기를 그대로 불러 쓰기 위한 통로 */
window.__ttTest = { cfg:cfg, makeQ:makeQ, AGE:AGE, VS:VS, G:function(){ return G; } };
</script>
